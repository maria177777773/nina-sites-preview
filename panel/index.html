<script>
// Панель работает на Маке через туннель, его адрес меняется. Свежий адрес лежит в panel/url.txt
// этого репозитория (обновляет Nina-Admin/scripts/stable-link.py). Читаем через API GitHub — там нет кэша Pages.
(function () {
  var ok = function (u) { return /^https:\/\/[a-z0-9.-]+\.lhr\.life$/.test(u) }
  var go = function (u) { location.replace(u + '/') }
  var api = 'https://api.github.com/repos/maria177777773/nina-sites-preview/contents/panel/url.txt?t=' + Date.now()
  var fallback = function () {
    fetch('url.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text() })
      .then(function (t) { t = t.trim(); ok(t) ? go(t) : wait() }).catch(wait)
  }
  var wait = function () { document.getElementById('msg').hidden = false; setTimeout(function () { location.reload() }, 30000) }
  fetch(api, { headers: { Accept: 'application/vnd.github.raw' }, cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw 0; return r.text() })
    .then(function (t) { t = t.trim(); ok(t) ? go(t) : fallback() })
    .catch(fallback)
})()
</script>
